[project]
name = "eval-kit"
version = "0.1.0"
description = "Automated evaluation of LLM agents, graphs, chatbots and RAG with LangSmith: trajectory checks, bootstrap statistics and a CI regression gate."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langsmith>=0.10.15",
    "openai>=1.40",
    "pydantic>=2.14.3",
    "python-dotenv>=1.0",
]

[project.scripts]
evalkit = "eval_kit.cli:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
